name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_TITLE: "革命学舎"
      PUBLIC_FIREBASE_API_KEY: "AIzaSyAZTLHMr1Z_NnCXUDcNoVQGnIyvKEjMkxw"
      PUBLIC_FIREBASE_PROJECT_ID: website-counter-3c07a
      PUBLIC_WORKER_URL: https://play-history-api.coiluck.workers.dev
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 26
          build-cmd: pnpm astro check && pnpm build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5